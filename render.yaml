services:
  - type: web
    name: dispute-copilot
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: PAYPAL_ENV
        value: sandbox
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: PUBLIC_DEMO
        value: "true"
      - key: DEMO_ADMIN_TOKEN
        generateValue: true
